name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/api tests/integration tests/resilience --cov=app --cov-report=term-missing

  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build postgres redis api worker
      - run: docker compose --profile test run --rm integration-tests
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
