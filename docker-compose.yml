services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testlab
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: tester
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tester -d testlab"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://tester:tester@postgres:5432/testlab
      REDIS_URL: redis://redis:6379/0
      QUEUE_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m worker.main
    environment:
      DATABASE_URL: postgresql+psycopg://tester:tester@postgres:5432/testlab
      REDIS_URL: redis://redis:6379/0
      PROCESSING_DELAY: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  integration-tests:
    build: .
    command: pytest tests/docker -v
    environment:
      BASE_URL: http://api:8000
    depends_on:
      - api
      - worker
    profiles: ["test"]
